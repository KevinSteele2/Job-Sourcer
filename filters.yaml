# Scoring order. Nothing here removes a job: it only decides which waiting
# jobs Claude scores first, so the nightly cap goes to the most promising ones.
# Each job gets points (see filters.py -> priority):
#   +3  title has an entry_level word
#   +1  title has a target_role phrase
#   +1  found through a new-grad source (the Simplify list or the sweep)
#   -2  title has a higher_level word
#   -3  the description asks for 3+ years of experience (a simple pattern, so
#       it can't tell "required" from "preferred": that's why it only lowers
#       priority; Claude's hard-gate check decides properly when scored)
priority:
  entry_level:
    - new grad
    - new grads
    - new graduate
    - graduate
    - entry level
    - entry-level
    - junior
    - jr
    - early career
    - university
    - campus
    - associate
    - apprentice
    - rotational
    - i
    - "1"
  target_roles:
    - software engineer
    - software developer
    - data analyst
    - data scientist
    - analytics engineer
    - business intelligence
    - machine learning engineer
  higher_level:
    - ii
    - iii
    - iv
    - "2"
    - "3"
    - lead
    - manager
    - architect
