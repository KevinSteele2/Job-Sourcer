# Rule-based pre-filter. Keep it permissive: only remove obvious mismatches.
# Anything borderline should pass and get a low score from Claude instead.
#
# Matching is case-insensitive and whole-word: "data" matches "Data Engineer"
# but not "Metadata". Word forms are separate words, so "engineer" does NOT
# match "Engineering Manager". List each form you want.
#
# An empty or missing list means "no rule" (everything passes that check).
# Edits apply automatically before the next scoring run.

title:
  # Pass only if the title contains at least one of these.
  include:
    - engineer
    - engineering
    - developer
    - software
    - swe
    - programmer
    - data
    - analyst
    - analytics
    - scientist
    - science
    - research
    - researcher
    - machine learning
    - ml
    - ai
    - business intelligence
    - bi
    - quantitative
  # Filtered out if the title contains any of these (checked first).
  # Seniority words are obvious mismatches for a new grad; "lead" and
  # "manager" are left out because they're ambiguous.
  exclude:
    - senior
    - sr
    - staff
    - principal
    - director
    - head of
    - vice president
    - vp
    - engineering manager
    - sales
    - account executive
    - recruiter

location:
  # Pass only if ANY location contains one of these (empty = allow all).
  include: []
  # Filtered out only if EVERY listed location matches one of these, so
  # "London; New York" passes but "London; Dublin" doesn't.
  # Blank locations always pass.
  exclude:
    # Outside the US
    - uk
    - united kingdom
